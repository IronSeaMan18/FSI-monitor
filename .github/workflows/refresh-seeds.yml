# v3.13.0 — daily seed refresh (VERSION.md v3.13.0, HANDOFF §4, B-025, B-109)
#
# Why this exists:
#   * flags.json decays fast: 94% coverage of planned IMOs -> 50% in four days,
#     because ShipNext's planned lists roll forward and VesselFinder blocks
#     Render's IP, so the server can never top itself up. Manual runs from a
#     laptop could not keep pace and stale seeds hid inspectable vessels.
#   * managers.json saved through the dashboard lands on Render's ephemeral
#     disk and is wiped by the very next deploy. Pulling it here BEFORE we
#     push means the redeploy cannot destroy it.
#
# What it does, daily at 05:00 UTC (and on the "Run workflow" button):
#   1. pull dashboard-saved managers from the live server and merge them
#   2. run refresh_flags.py (VesselFinder from GitHub's IP - NOT Render's)
#   3. commit + push only if a seed actually changed -> Render redeploys
#
# Every run prints one line - 'VESSELFINDER REACHABILITY: OK|BLOCKED|FAILED' -
# in the 'Refresh seeds' step. Run #1 (13 Sep 2026) was inconclusive: the seed
# had been refreshed by hand that morning, so there was nothing to resolve.
# If BLOCKED, the flags half cannot work from GitHub; the managers half still does.

name: refresh-seeds

on:
  schedule:
    - cron: "0 5 * * *"      # 05:00 UTC daily - user is asleep, race window is smallest
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: write            # needed to push the refreshed seeds

concurrency:
  group: refresh-seeds
  cancel-in-progress: false  # never kill a run mid-resolve; progress is saved incrementally anyway

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIVE_URL: https://fsi-monitor.onrender.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh seeds (managers from live, flags from VesselFinder)
        run: python3 refresh_flags.py --live "$LIVE_URL"

      - name: Sanity-check the seeds before committing anything
        run: |
          python3 - <<'PY'
          import json, re, sys
          f = json.load(open("flags.json")); m = json.load(open("managers.json"))
          bad = [k for k, v in f.items() if not (re.fullmatch(r"\d{7}", k) and re.fullmatch(r"[A-Z]{2}", str(v)))]
          badm = [k for k, v in m.items() if not (re.fullmatch(r"\d{7}", k) and isinstance(v, dict) and v.get("ism"))]
          print(f"flags.json: {len(f)} entries, {len(bad)} malformed | managers.json: {len(m)} entries, {len(badm)} malformed")
          if bad or badm or len(f) < 100:
              print("REFUSING TO COMMIT:", bad[:5], badm[:5]); sys.exit(1)
          PY

      - name: Commit and push if anything changed
        run: |
          git config user.name  "refresh-seeds[bot]"
          git config user.email "refresh-seeds@users.noreply.github.com"
          git add flags.json managers.json
          if git diff --cached --quiet; then
            echo "seeds unchanged - nothing to push"
            exit 0
          fi
          f=$(python3 -c "import json;print(len(json.load(open('flags.json'))))")
          m=$(python3 -c "import json;print(len(json.load(open('managers.json'))))")
          git commit -m "chore: refresh seeds — flags.json ${f} IMOs, managers.json ${m} vessels [skip ci]"
          git push
